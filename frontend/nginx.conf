server {
    listen 80;
    server_name localhost;
    
    # 前端静态文件目录
    root /usr/share/nginx/html;
    index index.html;

    # 上传文件大小限制（Excel 导入等）
    client_max_body_size 20m;

    # 全局字符集声明，防止 Nginx 代理时丢弃后端响应头中的 charset
    charset utf-8;
    default_type application/json;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+text;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由配置（支持 SPA history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI Gateway API 代理（SSE需要特殊配置）
    location /ai/ {
        proxy_pass http://wms-ai-gateway:8090;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE 需要禁用缓冲，保持长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        
        # SSE headers
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # 后端 API 代理
    location /api/ {
        # 代理到后端服务（保留完整路径，以便后端正确接收 /api/auth/login）
        proxy_pass http://wms-backend:8080;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 强制 UTF-8，防止 Nginx 去掉后端响应头中的 charset
        proxy_hide_header Content-Type;
        add_header Content-Type 'application/json; charset=UTF-8' always;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
