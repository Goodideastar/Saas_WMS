version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: wms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wms123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wms}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - wms-network

  redis:
    image: redis:latest
    container_name: wms-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      TZ: Asia/Shanghai
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - wms-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_OPTS: "-Xmx512m"
    container_name: wms-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-wms}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wms123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-wms-jwt-secret-key-2024-very-long-secret-for-security}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - wms-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: wms-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - wms-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  ai-gateway:
    build: ./ai-gateway
    container_name: wms-ai-gateway
    ports:
      - "8090:8090"
    environment:
      - LLM_PROVIDER=qwen
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=https://maas-api.cn-huabei-1.xf-yun.com/v2
      - LLM_MODEL=xopqwen36v35b
      - WMS_BASE_URL=http://backend:8080
      - REDIS_URL=redis://redis:6379/0
      - AI_GATEWAY_PORT=8090
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - wms-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  wms-network:
    driver: bridge
